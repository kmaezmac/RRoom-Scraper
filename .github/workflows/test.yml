name: Cloud runner tests
on:
  push:
    paths: ['github-actions/**', '.github/workflows/**']
  pull_request:
    paths: ['github-actions/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Exercise the same queue policy without credentials or ROOM operations.
  # All three jobs must finish; the default single-pending policy can cancel one.
  queue-check:
    strategy:
      fail-fast: false
      matrix:
        request: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    concurrency:
      group: room-queue-test-${{ github.run_id }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: 複数の待機要求を破棄せず順次実行
        run: sleep 15
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: github-actions
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: github-actions/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser
      - name: Public ROOM connectivity (no credentials or mutations)
        run: npm run probe
