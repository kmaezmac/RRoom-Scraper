name: Cloud runner tests
on:
  push:
    paths: ['github-actions/**', '.github/workflows/**']
  pull_request:
    paths: ['github-actions/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: github-actions
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: github-actions/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser
      - name: Public ROOM connectivity (no credentials or mutations)
        run: npm run probe
