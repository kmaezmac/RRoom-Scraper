name: 楽天ROOM自動投稿
run-name: 楽天ROOM / ${{ inputs.source == 'cron-job.org' && 'cron-job.org' || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      source:
        description: 起動元（cron-job.orgはAPIリクエストで指定）
        required: true
        default: manual
        type: choice
        options: [manual, cron-job.org]
      account:
        description: 実行するアカウント（account2_3はaccount2→account3）
        required: true
        default: all
        type: choice
        options: [all, account1, account2, account3, account1_2, account1_3, account2_3]
      mode:
        description: diagnoseはAPI・ログイン・投稿画面の確認のみ
        required: true
        default: diagnose
        type: choice
        options: [diagnose, run]
      max_items:
        description: ランキング取得件数の上限（1〜30、通常30）
        required: true
        default: '30'
        type: string
      max_posts:
        description: 新規投稿数の上限（1〜30、コレ済みは数えない）
        required: true
        default: '30'
        type: string

permissions:
  contents: read

# cron-job.org owns the schedule. Retain pending dispatches rather than replacing
# the previous pending run when another request arrives (up to 100 pending runs).
concurrency:
  group: rakuten-room
  cancel-in-progress: false
  queue: max

jobs:
  post:
    runs-on: ubuntu-24.04
    # Up to 90 candidates, including reopening each new post to verify it.
    timeout-minutes: 180
    defaults:
      run:
        working-directory: github-actions
    env:
      RUN_ACCOUNT: ${{ inputs.account || 'all' }}
      RUN_MODE: ${{ inputs.mode || 'diagnose' }}
      MAX_ITEMS: ${{ inputs.max_items || '30' }}
      MAX_POSTS: ${{ inputs.max_posts || '30' }}
      RAKUTEN_USER_ID: ${{ secrets.RAKUTEN_USER_ID }}
      RAKUTEN_PASSWORD: ${{ secrets.RAKUTEN_PASSWORD }}
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_USER_ID2: ${{ secrets.RAKUTEN_USER_ID2 }}
      RAKUTEN_PASSWORD2: ${{ secrets.RAKUTEN_PASSWORD2 }}
      RAKUTEN_APP_ID2: ${{ secrets.RAKUTEN_APP_ID2 }}
      RAKUTEN_USER_ID3: ${{ secrets.RAKUTEN_USER_ID3 }}
      RAKUTEN_PASSWORD3: ${{ secrets.RAKUTEN_PASSWORD3 }}
      RAKUTEN_APP_ID3: ${{ secrets.RAKUTEN_APP_ID3 }}
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
      RAKUTEN_SESSION: ${{ secrets.RAKUTEN_SESSION }}
      RAKUTEN_SESSION2: ${{ secrets.RAKUTEN_SESSION2 }}
      RAKUTEN_SESSION3: ${{ secrets.RAKUTEN_SESSION3 }}
      USE_OPENAI: 'false'
      HISTORY_ENABLED: ${{ vars.HISTORY_ENABLED || 'false' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ACCOUNT_GENRES1: ${{ vars.ACCOUNT_GENRES1 }}
      ACCOUNT_GENRES2: ${{ vars.ACCOUNT_GENRES2 }}
      ACCOUNT_GENRES3: ${{ vars.ACCOUNT_GENRES3 }}
      RANKING_PAGES_PER_RUN: ${{ vars.RANKING_PAGES_PER_RUN || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: github-actions/package-lock.json
      - name: 依存パッケージを固定バージョンでインストール
        run: npm ci
      - name: 必須設定を確認
        run: node index.js --check-config
      - name: 暗号化済みセッションを復元
        uses: actions/cache/restore@v4
        with:
          path: github-actions/.state/*.enc
          key: room-session-v1-${{ vars.SESSION_VERSION || '1' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            room-session-v1-${{ vars.SESSION_VERSION || '1' }}-
      - name: ヘッドレスChromiumをインストール
        run: npx playwright install --with-deps chromium --only-shell
      - name: 実行
        run: npm start
      - name: 更新した暗号化セッションを保存
        if: always() && hashFiles('github-actions/.state/*.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: github-actions/.state/*.enc
          key: room-session-v1-${{ vars.SESSION_VERSION || '1' }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 件数とエラー分類のみを保存（Cookie・画面・HTMLを含めない）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: github-actions/reports/summary.json
          if-no-files-found: ignore
          retention-days: 7
