name: 楽天ROOM自動投稿

on:
  schedule:
    # 日本時間 8時・12時・18時・23時 に実行（UTC +9時間）
    - cron: '0 23,3,9,14 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 依存パッケージをインストール
        run: npm install
        working-directory: github-actions

      - name: スクリプトを実行
        env:
          RAKUTEN_USER_ID: ${{ secrets.RAKUTEN_USER_ID }}
          RAKUTEN_PASSWORD: ${{ secrets.RAKUTEN_PASSWORD }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_USER_ID2: ${{ secrets.RAKUTEN_USER_ID2 }}
          RAKUTEN_PASSWORD2: ${{ secrets.RAKUTEN_PASSWORD2 }}
          RAKUTEN_APP_ID2: ${{ secrets.RAKUTEN_APP_ID2 }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: node index.js
        working-directory: github-actions
