name: 楽天ROOM自動投稿

on:
  # schedule:
  #   # 日本時間 7,9,11,13,15,17,19,21,23時に実行（UTC +9時間）
  #   - cron: '0 22,0,2,4,6,8,10,12,14 * * *'
  workflow_dispatch:
    inputs:
      account:
        description: '実行するアカウント'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - account1
          - account2

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 依存パッケージをインストール
        run: npm install
        working-directory: github-actions

      - name: Playwright ブラウザをインストール
        run: npx playwright install chromium --with-deps
        working-directory: github-actions

      - name: スクリプトを実行
        env:
          RAKUTEN_USER_ID: ${{ secrets.RAKUTEN_USER_ID }}
          RAKUTEN_PASSWORD: ${{ secrets.RAKUTEN_PASSWORD }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_USER_ID2: ${{ secrets.RAKUTEN_USER_ID2 }}
          RAKUTEN_PASSWORD2: ${{ secrets.RAKUTEN_PASSWORD2 }}
          RAKUTEN_APP_ID2: ${{ secrets.RAKUTEN_APP_ID2 }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          RUN_ACCOUNT: ${{ github.event.inputs.account || 'both' }}
        run: node index.js
        working-directory: github-actions
